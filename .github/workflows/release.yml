name: Release Build

# Runs on every push (any branch or tag) so the version check below always
# runs and catches drift early - but the actual build and release only
# ever happen for a tag matching 'v*' (e.g. v1.0.0), via the `if:` guards
# on the build and create_release jobs further down.
on:
  push:

jobs:
  # Runs on every push, unlike build/create_release below - nothing else
  # in the pipeline can run without this having passed first, so a version
  # mismatch fails immediately rather than at release time.
  determine_version:
    name: Determine and validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cargo_version.outputs.version }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        # No lfs: true - this job only reads Cargo.toml and arch/PKGBUILD,
        # both plain text, not anything git-lfs-tracked.

      - name: Check Cargo.toml version against arch/PKGBUILD
        id: cargo_version
        run: |
          set -euo pipefail
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/' | tr -d '\r' | xargs)
          PKGBUILD_VERSION=$(grep -m1 '^pkgver=' arch/PKGBUILD | sed -E 's/pkgver=(.*)/\1/' | tr -d '\r' | xargs)
          echo "Cargo.toml version:   $CARGO_VERSION"
          echo "arch/PKGBUILD pkgver: $PKGBUILD_VERSION"
          if [ "$CARGO_VERSION" != "$PKGBUILD_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match arch/PKGBUILD's pkgver ($PKGBUILD_VERSION) - these should stay in sync (see .githooks/pre-commit, which normally keeps this from happening)."
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

      # Only meaningful once an actual release tag exists to compare
      # against - a plain branch push has no tag, so this step is skipped
      # there rather than comparing Cargo.toml against a branch name.
      - name: Check Cargo.toml version against the pushed tag
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          set -euo pipefail
          CARGO_VERSION="${{ steps.cargo_version.outputs.version }}"
          TAG_VERSION=$(printf '%s' "${GITHUB_REF_NAME#v}" | tr -d '\r' | xargs)
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Git tag version:    $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match the pushed tag ($GITHUB_REF_NAME) - refusing to build or publish a mismatched release."
            exit 1
          fi

  build:
    name: Build on ${{ matrix.os }}
    needs: determine_version
    # Actual builds only happen for a 'v*' tag push - see the top-level
    # comment on `on:`. A plain branch push stops after determine_version.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ${{ matrix.os }}

    # Run two jobs in parallel: one on Linux, one on Windows[cite: 2]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: statorius-linux-amd64
            binary_name: statorius
          - os: windows-latest
            artifact_name: statorius-windows-amd64.exe
            binary_name: statorius.exe

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # build.rs decodes ico/statorius-master.png on every build to
          # generate the app icon - without this, actions/checkout leaves
          # git-lfs-tracked files as their pointer text, not the real PNG,
          # and the build fails immediately.
          lfs: true

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # LINUX ONLY: Install the native C-headers for pcap[cite: 2]
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # WINDOWS ONLY: Download Npcap SDK and set environment variable[cite: 2]
      - name: Setup Npcap SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" -OutFile "npcap-sdk.zip"
          Expand-Archive -Path "npcap-sdk.zip" -DestinationPath "npcap-sdk"
          
          # Add the extracted library path to the MSVC LIB environment variable so link.exe can find wpcap.lib[cite: 2]
          echo "LIB=${{ github.workspace }}\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Release Binary
        run: cargo build --release

      - name: Build MSI Installer (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo install cargo-wix
          cargo wix --nocapture

      # Upload the finished pure .exe binary as an artifact[cite: 2]
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/${{ matrix.binary_name }}

      - name: Upload MSI Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: statorius-windows-installer
          path: target/wix/*.msi

  # Once both builds finish, create a GitHub Release and attach the binaries[cite: 2]
  create_release:
    name: Create GitHub Release
    needs: [determine_version, build]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Applies the already-validated version into arch/PKGBUILD's text -
      # pkgver, plus the source tarball's checksum, which can only be
      # computed here: it has to hash the tag's own archive on GitHub,
      # which doesn't exist until after the tag is pushed.
      - name: Update arch/PKGBUILD version and source checksum
        run: |
          set -euo pipefail
          CARGO_VERSION="${{ needs.determine_version.outputs.version }}"

          sed -i "s/^pkgver=.*/pkgver=${CARGO_VERSION}/" arch/PKGBUILD

          curl -sL -o /tmp/source.tar.gz \
            "https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SUM=$(sha256sum /tmp/source.tar.gz | awk '{print $1}')
          # Only the first SKIP (the fetched source tarball) gets pinned -
          # the second is the locally-provided .desktop file, left as-is.
          sed -i "0,/'SKIP'/s//'${SUM}'/" arch/PKGBUILD

          cat arch/PKGBUILD

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/statorius-linux-amd64/*
            artifacts/statorius-windows-amd64.exe/*
            artifacts/statorius-windows-installer/*
            arch/PKGBUILD
          generate_release_notes: true