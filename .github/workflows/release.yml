name: Release Build

# This workflow triggers ONLY when you push a tag that starts with 'v' (e.g., v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # Run two jobs in parallel: one on Linux, one on Windows[cite: 2]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: statorius-linux-amd64
            binary_name: statorius
          - os: windows-latest
            artifact_name: statorius-windows-amd64.exe
            binary_name: statorius.exe

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # LINUX ONLY: Install the native C-headers for pcap[cite: 2]
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # WINDOWS ONLY: Download Npcap SDK and set environment variable[cite: 2]
      - name: Setup Npcap SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" -OutFile "npcap-sdk.zip"
          Expand-Archive -Path "npcap-sdk.zip" -DestinationPath "npcap-sdk"
          
          # Add the extracted library path to the MSVC LIB environment variable so link.exe can find wpcap.lib[cite: 2]
          echo "LIB=${{ github.workspace }}\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Release Binary
        run: cargo build --release

      # -----------------------------------------------------
      # NEW: Install cargo-wix and build the MSI on Windows
      # -----------------------------------------------------
      - name: Build MSI Installer (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo install cargo-wix
          cargo wix --nocapture

      # Upload the finished pure .exe binary as an artifact[cite: 2]
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/${{ matrix.binary_name }}

      # -----------------------------------------------------
      # NEW: Upload the MSI artifact
      # -----------------------------------------------------
      - name: Upload MSI Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: statorius-windows-installer
          path: target/wix/*.msi

  # Once both builds finish, create a GitHub Release and attach the binaries[cite: 2]
  create_release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # -----------------------------------------------------
      # NEW: Keep arch/PKGBUILD's version in sync with Cargo.toml
      # instead of hand-maintaining it (this is what let pkgver drift
      # to 0.4.5 while Cargo.toml had already moved to 0.4.6). Also
      # fails the release outright if Cargo.toml and the pushed tag
      # ever disagree, and pins the source tarball checksum for this
      # exact tag instead of leaving it as 'SKIP'.
      # -----------------------------------------------------
      - name: Sync arch/PKGBUILD version with Cargo.toml
        run: |
          set -euo pipefail
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/' | tr -d '\r' | xargs)
          TAG_VERSION=$(printf '%s' "${GITHUB_REF_NAME#v}" | tr -d '\r' | xargs)
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Git tag version:    $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match the pushed tag ($GITHUB_REF_NAME) - refusing to publish a mismatched PKGBUILD."
            exit 1
          fi

          sed -i "s/^pkgver=.*/pkgver=${CARGO_VERSION}/" arch/PKGBUILD

          curl -sL -o /tmp/source.tar.gz \
            "https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SUM=$(sha256sum /tmp/source.tar.gz | awk '{print $1}')
          # Only the first SKIP (the fetched source tarball) gets pinned -
          # the second is the locally-provided .desktop file, left as-is.
          sed -i "0,/'SKIP'/s//'${SUM}'/" arch/PKGBUILD

          cat arch/PKGBUILD

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # NEW: Added the MSI folder and the version-synced PKGBUILD to the files list
          files: |
            artifacts/statorius-linux-amd64/*
            artifacts/statorius-windows-amd64.exe/*
            artifacts/statorius-windows-installer/*
            arch/PKGBUILD
          generate_release_notes: true