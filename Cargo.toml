[package]
name = "statorius"
version = "0.8.3"
edition = "2024"
license = "AGPL-3.0-only"
description = "Network probing toolbox: ICMP/TCP/UDP and L2 ping, DHCP monitoring, DNS queries"

# Debian/Ubuntu package, built with `cargo deb` (cargo-deb) - see
# .github/workflows/release.yml. Version, description and license come from
# [package] above, so a release needs no second place to keep in sync (unlike
# arch/PKGBUILD, which the pre-commit hook has to track).
[package.metadata.deb]
# Same placeholder as arch/PKGBUILD; replace with the real maintainer.
maintainer = "Your Name <your.email@example.com>"
copyright = "Your Name"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
extended-description = "Statorius is a desktop toolbox for probing and inspecting networks: ICMP/TCP/UDP ping, L2 ping, DHCP monitoring, DNS queries and an interface overview."
# `$auto` resolves the linked libraries (glibc, ...). The GUI's window system,
# keyboard and graphics libraries are opened at runtime (winit, wgpu), so
# that detection can't see them; they are listed by hand. Depends = what a
# window needs to open on X11 (also covers XWayland) - startup fails without
# any of the X11 libraries or xkbcommon-x11 - plus Vulkan or EGL for
# rendering (either one is enough). Recommends = the Wayland libraries (only
# used in a Wayland session), the Mesa drivers, and the L2 features' needs:
# without libpcap only L2 Ping and DHCP are unavailable (src/pcap.rs), without
# pkexec L2 mode can't elevate its helper. `libpcap0.8t64` is libpcap's name
# since Ubuntu 24.04 / Debian 13.
depends = "$auto, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxkbcommon0, libxkbcommon-x11-0, libvulkan1 | libegl1"
recommends = "libpcap0.8t64 | libpcap0.8, pkexec | policykit-1, libwayland-client0, libwayland-cursor0, libwayland-egl1, mesa-vulkan-drivers, libgl1-mesa-dri"
assets = [
    ["target/release/statorius", "usr/bin/", "755"],
    ["arch/statorius.desktop", "usr/share/applications/", "644"],
    # One entry per size under ico/hicolor/ (a glob would flatten the
    # directories); a new size needs a new line here.
    ["ico/hicolor/16x16/apps/statorius.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["ico/hicolor/32x32/apps/statorius.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["ico/hicolor/48x48/apps/statorius.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["ico/hicolor/64x64/apps/statorius.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["ico/hicolor/128x128/apps/statorius.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["ico/hicolor/256x256/apps/statorius.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[profile.release]
lto = true          # Link Time Optimization: merges all crates into one unit
codegen-units = 1   # Reduces parallel compilation to allow more aggressive optimizations
panic = "abort"     # Removes stack unwinding code (saves a lot of space)
strip = true        # Automatically strips symbols from the binary

[dependencies]
eframe = "0.36.2" # GUI framework
tokio = { version = "1.53.2", features = ["full"] } # Async runtime
surge-ping = "0.9.1" # Async ICMP
# Useful for retrieving local IPs
default-net = "0.22.0"
# Loads Npcap (wpcap.dll) / libpcap at runtime - see src/pcap.rs - and probes
# the Vulkan/EGL loaders for the About tab and the startup error report - see
# src/graphics.rs. Neither is linked at build time, so the executable starts
# without them and no Npcap SDK is needed to build.
libloading = "0.8"
# Lets PingBackend be a plain `async fn`-based trait usable as `Box<dyn PingBackend>`
async-trait = "0.1.92"
# Raw Ethernet/VLAN/ARP/IPv4/ICMP frame construction+parsing for L2 pings.
# Deliberately pnet_packet, NOT the full pnet crate: pnet also pulls in
# pnet_datalink (its own native capture layer), which links Packet.lib on
# Windows even though we never call into it - our own L2 engine does its own
# capture via the `pcap` crate above. pnet_packet alone is pure Rust with no
# native linking at all, so it can't cause this class of problem.
pnet_packet = "0.35.0"
# MacAddr itself lives here, not in pnet_packet::util (that module is just
# checksum helpers) - pnet_packet depends on pnet_base internally but
# doesn't re-export it, so we need it directly too. Also pure Rust, no
# native linking.
pnet_base = "0.35.0"

# System DNS server discovery (resolv.conf on Linux, registry on Windows)
# plus A/AAAA resolution with CNAME chasing, for the "DNS Servers" tab and
# hostname resolution on the Ping tab. Default features ("system-config" +
# "tokio") are exactly what's needed here - no TLS/DoH/DNSSEC extras.
hickory-resolver = "0.26.3"

# Wire format for the GUI <-> elevated L2 helper IPC protocol
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Windows-only: ShellExecuteW's "runas" verb, to UAC-elevate the L2 helper
[target.'cfg(windows)'.dependencies]
windows-sys = {
    version = "0.61.2",
    features = [
        "Win32_Foundation",
        "Win32_UI_Shell",
        "Win32_UI_WindowsAndMessaging",
    ]
}

# Decodes ico/statorius-master.png and resizes it (with a manual
# premultiplied-alpha step - see build.rs - to avoid black fringing from
# the source's fully-transparent corners) into the runtime app icon on
# every platform, and additionally into a multi-resolution .ico on
# Windows. "ico" is the .ico encoder used by write_windows_ico(); it pulls
# in "bmp" transitively (an .ico frame can technically be stored as
# embedded BMP) but we always write PNG-format frames, so that codec goes
# unused.
#
# winresource embeds that .ico into the .exe as a PE resource - it's only
# ever *invoked* on Windows (see the CARGO_CFG_TARGET_OS check in
# build.rs's main()), but both crates are plain build-dependencies rather
# than target-gated: cfg() on a [target.'cfg(...)'.build-dependencies]
# table is evaluated against the HOST doing the build, not the target
# being built for (build scripts always run on the host), so gating
# winresource under cfg(windows) there would silently drop it whenever
# cross-compiling to Windows from a non-Windows host - exactly this
# project's normal Linux-to-windows-gnu workflow. Compiling it
# unconditionally and no-op'ing at runtime instead (its own documented
# pattern) works on every host/target combination.
[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
winresource = "0.1.31"