[package]
name = "statorius"
version = "0.7.10"
edition = "2024"
license = "AGPL-3.0-only"

[profile.release]
lto = true          # Link Time Optimization: merges all crates into one unit
codegen-units = 1   # Reduces parallel compilation to allow more aggressive optimizations
panic = "abort"     # Removes stack unwinding code (saves a lot of space)
strip = true        # Automatically strips symbols from the binary

[dependencies]
eframe = "0.36.1" # GUI framework
tokio = { version = "1.53.1", features = ["full"] } # Async runtime
surge-ping = "0.9.0" # Async ICMP
# Useful for retrieving local IPs
default-net = "0.22.0"
# L2 capability probing now, raw Ethernet frame capture/injection later
# (Npcap on Windows, libpcap on Linux)
pcap = "2.5.0"
# Lets PingBackend be a plain `async fn`-based trait usable as `Box<dyn PingBackend>`
async-trait = "0.1.92"
# Raw Ethernet/VLAN/ARP/IPv4/ICMP frame construction+parsing for L2 pings.
# Deliberately pnet_packet, NOT the full pnet crate: pnet also pulls in
# pnet_datalink (its own native capture layer), which links Packet.lib on
# Windows even though we never call into it - our own L2 engine does its own
# capture via the `pcap` crate above. pnet_packet alone is pure Rust with no
# native linking at all, so it can't cause this class of problem.
pnet_packet = "0.35.0"
# MacAddr itself lives here, not in pnet_packet::util (that module is just
# checksum helpers) - pnet_packet depends on pnet_base internally but
# doesn't re-export it, so we need it directly too. Also pure Rust, no
# native linking.
pnet_base = "0.35.0"

# System DNS server discovery (resolv.conf on Linux, registry on Windows)
# plus A/AAAA resolution with CNAME chasing, for the "DNS Servers" tab and
# hostname resolution on the Ping tab. Default features ("system-config" +
# "tokio") are exactly what's needed here - no TLS/DoH/DNSSEC extras.
hickory-resolver = "0.26.1"

# Wire format for the GUI <-> elevated L2 helper IPC protocol
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-sys = "0.61.2"

# Windows-only: ShellExecuteW's "runas" verb, to UAC-elevate the L2 helper
[target.'cfg(windows)'.dependencies]
windows-sys = {
    version = "0",
    features = [
        "Win32_Foundation",
        "Win32_UI_Shell",
        "Win32_UI_WindowsAndMessaging",
    ]
}

# Decodes ico/statorius-master.png and resizes it (with a manual
# premultiplied-alpha step - see build.rs - to avoid black fringing from
# the source's fully-transparent corners) into the runtime app icon on
# every platform, and additionally into a multi-resolution .ico on
# Windows. "ico" is the .ico encoder used by write_windows_ico(); it pulls
# in "bmp" transitively (an .ico frame can technically be stored as
# embedded BMP) but we always write PNG-format frames, so that codec goes
# unused.
#
# winresource embeds that .ico into the .exe as a PE resource - it's only
# ever *invoked* on Windows (see the CARGO_CFG_TARGET_OS check in
# build.rs's main()), but both crates are plain build-dependencies rather
# than target-gated: cfg() on a [target.'cfg(...)'.build-dependencies]
# table is evaluated against the HOST doing the build, not the target
# being built for (build scripts always run on the host), so gating
# winresource under cfg(windows) there would silently drop it whenever
# cross-compiling to Windows from a non-Windows host - exactly this
# project's normal Linux-to-windows-gnu workflow. Compiling it
# unconditionally and no-op'ing at runtime instead (its own documented
# pattern) works on every host/target combination.
[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
winresource = "0.1.31"